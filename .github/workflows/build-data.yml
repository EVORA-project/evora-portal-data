name: Build EVORA portal data

on:
  schedule:
    - cron: "15 2 * * *"   # every day at 02:15 UTC
  workflow_dispatch:

jobs:
  build_and_commit:
    name: Build & commit portal data
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: PORTAL_DATA_WORKFLOW

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export GSHEET SA JSON 
        run: |
          set -e
          decoded=$(echo "${{ secrets.ERINHA_GSHEET_SA_JSON }}" | base64 --decode)
          echo "::add-mask::$decoded"
          echo "ERINHA_GSHEET_SA_JSON=$decoded" >> $GITHUB_ENV

      - name: Export remaining secrets as local env vars
        run: |
          set -e
          echo "EVA_FEED_TOKEN=${{ secrets.EVA_FEED_TOKEN }}" >> $GITHUB_ENV
          echo "ERINHA_SHEET_ID=${{ secrets.ERINHA_SHEET_ID }}" >> $GITHUB_ENV
          echo "ERINHA_SHEET_GID=${{ secrets.ERINHA_SHEET_GID }}" >> $GITHUB_ENV
          echo "FAIRSHARING_LOGIN=${{ secrets.FAIRSHARING_LOGIN }}" >> $GITHUB_ENV
          echo "FAIRSHARING_PWD=${{ secrets.FAIRSHARING_PWD }}" >> $GITHUB_ENV

      - name: Prepare ICTV helper
        run: |
          set -e
          curl -f -L \
            "https://cdn.jsdelivr.net/gh/EVORA-project/ictv-ontology/helpers/python/ictv-api.py?latest=true" \
            -o scripts/ictv-enrich/ictv_api.py
          echo "Downloaded latest ictv_api.py"

      - name: Fetch EVA JSON-LD pages
        run: |
          set -e
          python scripts/eva-data/fetch_eva_jsonld.py

      - name: Merge EVA JSON-LD pages
        run: |
          set -e
          python scripts/eva-data/merge_eva_jsonld.py

      - name: Fetch ERINHA catalogue from Google Sheet
        run: |
          set -e
          python scripts/erinha-data/fetch_erinha_csv.py

      - name: Convert ERINHA CSV to EVORAO JSON-LD
        run: |
          set -e
          python scripts/erinha-data/erinha_to_evorao.py

      - name: Fetch FAIRsharing curated record
        run: |
          set -e
          python scripts/fairsharing-data/fetch_fairsharing_elixir.py

      - name: Convert FAIRsharing → EVORAO Services
        run: |
          set -e
          python scripts/fairsharing-data/fairsharing_to_evorao.py

      - name: Invalidate outdated cache
        run: |
          set -e
          CACHE="data/ictv_cache.json"
          OLS_META=$(curl -f -s https://www.ebi.ac.uk/ols4/api/ontologies/ictv)
          OLS_UPDATED=$(echo "$OLS_META" | jq -r '.updated')

          if [ ! -f "$CACHE" ]; then
            echo "📦 No existing cache — nothing to delete."
            exit 0
          fi

          LOCAL_TS=$(jq -r '._fetched_at // empty' "$CACHE")

          if [ -z "$LOCAL_TS" ]; then
            echo "❗ Cache has no timestamp — deleting."
            rm -f "$CACHE"
            exit 0
          fi

          echo "📅 ICTV OLS updated: $OLS_UPDATED"
          echo "📅 Local cache timestamp: $LOCAL_TS"

          # Compare timestamps in ISO8601 format — lexical comparison works.
          if [[ "$LOCAL_TS" < "$OLS_UPDATED" ]]; then
            echo "🔄 ICTV OLS is newer — deleting outdated cache."
            rm -f "$CACHE"
          else
            echo "👍 Cache is up to date."
          fi

      - name: Enrich EVA data with ICTV taxonomy
        run: |
          set -e
          python scripts/ictv-enrich/enrich_with_ictv.py \
            --input data/eva/eva_merged.jsonld \
            --output data/eva/eva_merged_enriched.jsonld \
            --cache data/ictv_cache.json

      - name: Enrich ERINHA data with ICTV taxonomy
        run: |
          set -e
          python scripts/ictv-enrich/enrich_with_ictv.py \
            --input data/erinha/erinha_services.jsonld \
            --output data/erinha/erinha_services_enriched.jsonld \
            --cache data/ictv_cache.json

      - name: Merge all partner data for portal
        run: |
          set -e
          python scripts/merge_all_partners.py
   
      - name: Commit and push changes
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update EVORA portal data (EVA + ERINHA + FAIRSHARING_ELIXIR, ICTV-enriched)"
            git push
          fi          

  publish_eu:
    name: Publish to data.europa.eu
    needs: build_and_commit
    runs-on: ubuntu-latest
    environment: PORTAL_DATA_WORKFLOW

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install required CLI tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y jq
          
      - name: Get EU Data Portal JWT
        run: |
          set -e
          RESP=$(curl -s -X POST "https://data.europa.eu/auth/middleware/login/service" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{
              \"client_id\": \"${{ secrets.EU_ID }}\",
              \"client_secret\": \"${{ secrets.EU_TOKEN }}\"
            }")

          TOKEN=$(echo "$RESP" | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ Failed to obtain EU JWT"
            echo "$RESP"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "EU_BEARER=$TOKEN" >> $GITHUB_ENV

      - name: Upload EVORA dataset to data.europa.eu hub-store
        run: |
          set -e
          FILE="data/portal/evora_portal_all.jsonld"
          CATALOG="${{ secrets.EU_ID }}"
          FILE_ID="${{ secrets.EU_FILE_ID }}"
          
          echo "Uploading EVORA dataset to EU portal (store)..."
          
          if [ -z "$FILE_ID" ]; then
            echo "No FILE_ID → creating new file (POST)"
            
            curl --fail --location --request POST \
              "https://data.europa.eu/api/hub/store/data?catalog=$CATALOG" \
              --header "Accept: application/json, text/plain, */*" \
              --header "Authorization: Bearer $EU_BEARER" \
              --form "file=@$FILE"
              
            echo "⚠️ Copy the returned id and store it as EU_FILE_ID secret."
            
          else
            echo "Updating existing file $FILE_ID (PUT)"
            
            curl --fail --location --request PUT \
              "https://data.europa.eu/api/hub/store/data/$FILE_ID?catalog=$CATALOG" \
              --header "Accept: application/json, text/plain, */*" \
              --header "Authorization: Bearer $EU_BEARER" \
              --form "file=@$FILE"
          fi
          
      - name: Generate EU dataset wrapper
        run: |
          set -e
      
          FILE_ID="${{ secrets.EU_FILE_ID }}"
          TODAY=$(date -u +"%Y-%m-%d")
          SIZE=$(stat -c%s data/portal/evora_portal_all.jsonld)
      
          cat > eu_dataset_wrapper.jsonld <<EOF
          {
          "@context": {
            "dcat": "http://www.w3.org/ns/dcat#",
            "dcterms": "http://purl.org/dc/terms/",
            "foaf": "http://xmlns.com/foaf/0.1/",
            "vcard": "http://www.w3.org/2006/vcard/ns#",
            "xsd": "http://www.w3.org/2001/XMLSchema#"
          },
          "@graph": [
            {
              "@id": "https://portal.evora-project.eu/dataset/evora-portal",
              "@type": "dcat:Dataset",
              "dcterms:identifier": "evora-portal-dataset",
              "dcterms:title": "EVORA Portal Catalogue",
              "dcterms:description": "Semantically harmonised catalogue of viral materials, derived products, services and related entities aggregated from EVA, ERINHA and FAIRsharing and transformed into EVORAO entities (https://w3id.org/evorao). A unified view of resources in virology to support pandemic preparedness and response.",
              "dcat:keyword": [
                { "@value": "virology", "@language": "en" },
                { "@value": "virus", "@language": "en" },
                { "@value": "viral materials", "@language": "en" },
                { "@value": "detection kit", "@language": "en" },
                { "@value": "service in virology", "@language": "en" },
                { "@value": "viral protein", "@language": "en" },
                { "@value": "viral nucleic acid", "@language": "en" },
                { "@value": "pandemic preparedness", "@language": "en" },
                { "@value": "outbreak", "@language": "en" },
                { "@value": "research infrastructures", "@language": "en" },
                { "@value": "European Virus Archive", "@language": "en" },
                { "@value": "EVA", "@language": "en" },
                { "@value": "European Research Infrastructure on Highly Pathogenic Agents", "@language": "en" },
                { "@value": "ERINHA", "@language": "en" },
                { "@value": "European life-sciences infrastructure for biological information", "@language": "en" },
                { "@value": "ELIXIR", "@language": "en" }
              ],
              "dcat:theme": [
                { "@id": "https://publications.europa.eu/resource/authority/eurovoc/3885" },
                { "@id": "https://publications.europa.eu/resource/authority/eurovoc/838" },
                { "@id": "https://publications.europa.eu/resource/authority/eurovoc/4060" }
              ],
              "dcterms:spatial": [
                { "@id": "http://publications.europa.eu/resource/authority/continent/EUROPE" },
                { "@id": "http://publications.europa.eu/resource/authority/continent/OCEANIA" },
                { "@id": "http://publications.europa.eu/resource/authority/continent/AFRICA" },
                { "@id": "http://publications.europa.eu/resource/authority/continent/ASIA" },
                { "@id": "http://publications.europa.eu/resource/authority/continent/AMERICA" }
              ],
              "dcterms:language": {
                "@id": "http://publications.europa.eu/resource/authority/language/ENG"
              },
              "dcterms:accessRights": {
                "@id": "http://publications.europa.eu/resource/authority/access-right/PUBLIC"
              },
              "dcterms:rights": {
                "@id": "https://creativecommons.org/licenses/by-sa/4.0/"
              },
              "dcterms:issued": {
                "@value": "2026-01-30",
                "@type": "xsd:date"
              },
              "dcterms:modified": {
                "@value": "$TODAY",
                "@type": "xsd:date"
              },
              "dcterms:temporal": {
                "@type": "dcterms:PeriodOfTime",
                "dcat:startDate": {
                  "@value": "1882-01-01",
                  "@type": "xsd:date"
                },
                "dcat:endDate": {
                  "@value": "$TODAY",
                  "@type": "xsd:date"
                }
              },
              "dcterms:publisher": {
                "@type": "foaf:Organization",
                "foaf:name": "European Viral Outbreak Response Alliance (EVORA)"
              },
              
              "dcat:contactPoint": {
                "@type": "vcard:Kind",
                "vcard:fn": "EVORA FAIR dataset Helpdesk",
                "vcard:hasEmail": {
                  "@id": "mailto:data-europa-helpdesk@evora-project.eu"
                },
                "vcard:hasURL": {
                  "@id": "https://evora-project.eu"
                }
              },
              "dcterms:license": {
                "@id": "http://creativecommons.org/licenses/by-sa/4.0/"
              },
              "dcat:landingPage": {
                "@id": "https://portal.evora-project.eu"
              },
              "dcat:distribution": {
                "@id": "https://data.europa.eu/api/hub/store/data/$FILE_ID"
              }
            },
            {
              "@id": "https://data.europa.eu/api/hub/store/data/$FILE_ID",
              "@type": "dcat:Distribution",
              "dcterms:identifier": "evora-portal-dataset-distribution",
              "dcterms:title": "EVORA Portal full JSON-LD export",
              "dcterms:issued": {
                "@value": "2026-01-30",
                "@type": "xsd:date"
              },
              "dcat:byteSize": {
                "@value": $SIZE,
                "@type": "http://www.w3.org/2001/XMLSchema#decimal"
              },
              "dcterms:modified": {
                "@value": "$TODAY",
                "@type": "xsd:date"
              },
              "dcterms:license": {
                "@id": "http://creativecommons.org/licenses/by-sa/4.0/"
              },
              "dcterms:rights": {
                "@id": "https://creativecommons.org/licenses/by-sa/4.0/"
              },
              "dcterms:accessRights": {
                "@id": "http://publications.europa.eu/resource/authority/access-right/PUBLIC"
              },
              "dcat:downloadURL": {
                "@id": "https://data.europa.eu/api/hub/store/data/$FILE_ID"
              },
              "dcat:accessURL": {
                "@id": "https://portal.evora-project.eu"
              },
              "dcat:mediaType": {
                "@id": "https://www.iana.org/assignments/media-types/application/ld+json"
              },
              "dcterms:format": {
                "@id": "http://publications.europa.eu/resource/authority/file-type/JSON_LD"
              },
              "dcat:accessService": {
                "@id": "https://portal-api.evora-europe.eu/service"
              }
            },
            {
              "@id": "https://portal-api.evora-europe.eu/service",
              "@type": "dcat:DataService",
              "dcterms:identifier": "evora-portal-dataset-api",
              "dcterms:title": "EVORA Portal API",
              "dcterms:description": "REST API providing programmatic access to EVORA catalogue entities including viral materials, products and services.",
              "dcat:endpointURL": {
                "@id": "https://portal-api.evora-europe.eu"
              },
              "dcat:endpointDescription": {
                "@id": "https://portal-api.evora-europe.eu/docs"
              },
              "dcterms:license": {
                "@id": "http://creativecommons.org/licenses/by-sa/4.0/"
              },
              "dcat:servesDataset": {
                "@id": "https://portal.evora-project.eu/dataset/evora-portal"
              },
              "dcterms:accessRights": {
                "@id": "https://publications.europa.eu/resource/authority/access-right/PUBLIC"
              }
            }
          ]
          }
          EOF

      - name: Publish dataset to EU catalogue hub-repo
        run: |
          set -e
          CATALOG="${{ secrets.EU_ID }}"
          DATASET_ID="evora-portal-dataset"
      
          echo "Publishing wrapper dataset to hub-repo..."
      
          curl --fail --location \
               --retry 6 \
               --retry-delay 300 \
               --retry-all-errors \
               --max-time 300 \
               --request PUT \
            "https://data.europa.eu/api/hub/repo/catalogues/$CATALOG/datasets/origin?originalId=$DATASET_ID" \
            --header "Content-Type: application/ld+json" \
            --header "Authorization: Bearer $EU_BEARER" \
            --data-binary @eu_dataset_wrapper.jsonld

