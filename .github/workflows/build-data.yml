name: Build EVORA portal data

on:
  schedule:
    - cron: "15 23 * * *"   # every day at 23:15 UTC
  workflow_dispatch:
    inputs:
      publish_existing:
        description: "Publish the existing committed export without rebuilding partner data"
        type: boolean
        default: false
      metadata_only:
        description: "Retry only the original hub-repo metadata update; use with publish_existing"
        type: boolean
        default: false
      resume_file_id:
        description: "Resume an existing pending store upload by file ID; creates no new file"
        type: string
        default: ""

jobs:
  build_and_commit:
    name: Build & commit portal data
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_existing
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: PORTAL_DATA_WORKFLOW
    outputs:
      data_commit: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test source metadata transformations
        run: python -m unittest discover -s tests -p 'test_source_metadata.py' -v

      - name: Export GSHEET SA JSON 
        run: |
          set -e
          decoded=$(echo "${{ secrets.ERINHA_GSHEET_SA_JSON }}" | base64 --decode)
          echo "::add-mask::$decoded"
          echo "ERINHA_GSHEET_SA_JSON=$decoded" >> $GITHUB_ENV

      - name: Export remaining secrets as local env vars
        run: |
          set -e
          echo "EVA_FEED_TOKEN=${{ secrets.EVA_FEED_TOKEN }}" >> $GITHUB_ENV
          echo "ERINHA_SHEET_ID=${{ secrets.ERINHA_SHEET_ID }}" >> $GITHUB_ENV
          echo "ERINHA_SHEET_GID=${{ secrets.ERINHA_SHEET_GID }}" >> $GITHUB_ENV
          echo "FAIRSHARING_LOGIN=${{ secrets.FAIRSHARING_LOGIN }}" >> $GITHUB_ENV
          echo "FAIRSHARING_PWD=${{ secrets.FAIRSHARING_PWD }}" >> $GITHUB_ENV

      - name: Prepare ICTV helper
        run: |
          set -e
          curl -f -L \
            "https://cdn.jsdelivr.net/gh/EVORA-project/ictv-ontology/helpers/python/ictv-api.py?latest=true" \
            -o scripts/ictv-enrich/ictv_api.py
          echo "Downloaded latest ictv_api.py"

      - name: Fetch EVA JSON-LD pages
        run: |
          set -e
          python scripts/eva-data/fetch_eva_jsonld.py

      - name: Merge EVA JSON-LD pages
        run: |
          set -e
          python scripts/eva-data/merge_eva_jsonld.py

      - name: Fetch ERINHA catalogue from Google Sheet
        run: |
          set -e
          python scripts/erinha-data/fetch_erinha_csv.py

      - name: Convert ERINHA CSV to EVORAO JSON-LD
        run: |
          set -e
          python scripts/erinha-data/erinha_to_evorao.py

      - name: Fetch FAIRsharing curated collections
        run: |
          set -e
          python scripts/fairsharing-data/fetch_fairsharing_elixir.py --collection-id 5449
          python scripts/fairsharing-data/fetch_fairsharing_elixir.py --collection-id 7589

      - name: Convert FAIRsharing → EVORAO Services
        run: |
          set -e
          python scripts/fairsharing-data/fairsharing_to_evorao.py --collection-id 5449
          python scripts/fairsharing-data/fairsharing_to_evorao.py --collection-id 7589

      - name: Invalidate outdated cache
        run: |
          set -e
          CACHE="data/ictv_cache.json"
          OLS_META=$(curl -f -s \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            https://www.ebi.ac.uk/ols4/api/ontologies/ictv || true)
          OLS_UPDATED=$(echo "$OLS_META" | jq -r '.updated // empty' 2>/dev/null || true)
          echo "OLS_UPDATED=$OLS_UPDATED" >> $GITHUB_ENV

          if [ ! -f "$CACHE" ]; then
            echo "📦 No existing cache — nothing to delete."
            exit 0
          fi
          
          LOCAL_TS=$(jq -r '._ols_updated_at // empty' "$CACHE" 2>/dev/null || true)

          if [ -z "$LOCAL_TS" ]; then
            echo "❗ Cache has no timestamp — deleting."
            rm -f "$CACHE"
            exit 0
          fi

          echo "📅 ICTV OLS updated: $OLS_UPDATED"
          echo "📅 Local cache timestamp: $LOCAL_TS"

          # Compare timestamps in ISO8601 format — lexical comparison works.
          if [ -z "$OLS_UPDATED" ]; then
            echo "⚠️ No OLS updated timestamp available — keeping existing cache."
          elif [[ "$LOCAL_TS" < "$OLS_UPDATED" ]]; then
            echo "🔄 ICTV OLS is newer — deleting outdated cache."
            rm -f "$CACHE"
          else
            echo "👍 Cache is up to date."
          fi

      - name: Enrich EVA data with ICTV taxonomy
        run: |
          set -e
          python scripts/ictv-enrich/enrich_with_ictv.py \
            --input data/eva/eva_merged.jsonld \
            --output data/eva/eva_merged_enriched.jsonld \
            --cache data/ictv_cache.json \
            --ols_updated_at "$OLS_UPDATED"

      - name: Enrich ERINHA data with ICTV taxonomy
        run: |
          set -e
          python scripts/ictv-enrich/enrich_with_ictv.py \
            --input data/erinha/erinha_services.jsonld \
            --output data/erinha/erinha_services_enriched.jsonld \
            --cache data/ictv_cache.json \
            --ols_updated_at "$OLS_UPDATED"

      - name: Merge all partner data for portal
        run: |
          set -e
          python scripts/merge_all_partners.py
   
      - name: Commit and push changes
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update EVORA portal data (EVA + ERINHA + FAIRsharing ELIXIR/EVORA, ICTV-enriched)"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish_eu:
    name: Publish to data.europa.eu
    needs: build_and_commit
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.build_and_commit.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.publish_existing)) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: PORTAL_DATA_WORKFLOW
    # Environment secrets are read when this job starts, after its concurrency
    # lock. Keep the rotating token at environment scope, not repository scope.
    concurrency:
      group: evora-eu-publication
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build_and_commit.outputs.data_commit || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install store publishing dependencies
        run: python -m pip install requests PyNaCl

      - name: Test store publisher
        run: python -m unittest discover -s tests -v

      - name: Install required CLI tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y jq
          
      - name: Validate EU publishing configuration
        env:
          EU_REFRESH_TOKEN: ${{ secrets.EU_REFRESH_TOKEN }}
          EU_SECRET_WRITER_TOKEN: ${{ secrets.EU_SECRET_WRITER_TOKEN }}
          EU_FILE_ID: ${{ secrets.EU_FILE_ID }}
          EU_ID: ${{ secrets.EU_ID }}
          EU_TOKEN: ${{ secrets.EU_TOKEN }}
        run: |
          set -euo pipefail
          for setting in EU_REFRESH_TOKEN EU_SECRET_WRITER_TOKEN EU_FILE_ID EU_ID EU_TOKEN; do
            if [ -z "${!setting}" ]; then
              echo "::error::Set $setting in the PORTAL_DATA_WORKFLOW environment. See README.md."
              exit 1
            fi
          done

      - name: Refresh EU store token and persist rotation
        if: ${{ !inputs.metadata_only }}
        env:
          EU_REFRESH_TOKEN: ${{ secrets.EU_REFRESH_TOKEN }}
          EU_SECRET_WRITER_TOKEN: ${{ secrets.EU_SECRET_WRITER_TOKEN }}
        run: python scripts/refresh_eu_store_token.py

      - name: Replace EVORA export in the migrated EU store
        if: ${{ !inputs.metadata_only }}
        env:
          EU_RESUME_FILE_ID: ${{ inputs.resume_file_id }}
          EU_SECRET_WRITER_TOKEN: ${{ secrets.EU_SECRET_WRITER_TOKEN }}
          EU_FILE_ID: ${{ secrets.EU_FILE_ID }}
          EU_CATALOG_ID: ${{ vars.EU_CATALOG_ID || 'evora' }}
        run: python scripts/publish_eu_store.py

      - name: Use the existing store file for metadata-only retry
        if: ${{ inputs.metadata_only }}
        env:
          FILE_ID: ${{ secrets.EU_FILE_ID }}
          STORE_CATALOG: ${{ vars.EU_CATALOG_ID || 'evora' }}
        run: |
          set -euo pipefail
          if [[ ! "$FILE_ID" =~ ^[A-Za-z0-9_-]+$ || ! "$STORE_CATALOG" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Invalid existing store file or catalogue ID."
            exit 1
          fi
          printf 'EU_DOWNLOAD_URL=https://data.europa.eu/data-management/store/api/data/%s/%s\n' "$STORE_CATALOG" "$FILE_ID" >> "$GITHUB_ENV"

      - name: Generate EU dataset wrapper
        run: |
          set -e
      
          : "${EU_DOWNLOAD_URL:?The store upload must succeed before generating metadata}"
          TODAY=$(date -u +"%Y-%m-%d")
          SIZE=$(stat -c%s data/portal/evora_portal_all.jsonld)
      
          cat > eu_dataset_wrapper.jsonld <<EOF
          {
          "@context": {
            "dcat": "http://www.w3.org/ns/dcat#",
            "dcterms": "http://purl.org/dc/terms/",
            "foaf": "http://xmlns.com/foaf/0.1/",
            "vcard": "http://www.w3.org/2006/vcard/ns#",
            "xsd": "http://www.w3.org/2001/XMLSchema#"
          },
          "@graph": [
            {
              "@id": "https://portal.evora-project.eu/dataset/evora-portal",
              "@type": "dcat:Dataset",
              "dcterms:identifier": "evora-portal-dataset",
              "dcterms:title": "EVORA Portal Catalogue",
              "dcterms:description": "Semantically harmonised catalogue of viral materials, derived products, services and related entities aggregated from EVA, ERINHA and FAIRsharing and transformed into EVORAO entities (https://w3id.org/evorao). A unified view of resources in virology to support pandemic preparedness and response.",
              "dcat:keyword": [
                { "@value": "virology", "@language": "en" },
                { "@value": "virus", "@language": "en" },
                { "@value": "viral materials", "@language": "en" },
                { "@value": "detection kit", "@language": "en" },
                { "@value": "service in virology", "@language": "en" },
                { "@value": "viral protein", "@language": "en" },
                { "@value": "viral nucleic acid", "@language": "en" },
                { "@value": "pandemic preparedness", "@language": "en" },
                { "@value": "outbreak", "@language": "en" },
                { "@value": "research infrastructures", "@language": "en" },
                { "@value": "European Virus Archive", "@language": "en" },
                { "@value": "EVA", "@language": "en" },
                { "@value": "European Research Infrastructure on Highly Pathogenic Agents", "@language": "en" },
                { "@value": "ERINHA", "@language": "en" },
                { "@value": "European life-sciences infrastructure for biological information", "@language": "en" },
                { "@value": "ELIXIR", "@language": "en" }
              ],
              "dcat:theme": [
                { "@id": "https://publications.europa.eu/resource/authority/eurovoc/3885" },
                { "@id": "https://publications.europa.eu/resource/authority/eurovoc/838" },
                { "@id": "https://publications.europa.eu/resource/authority/eurovoc/4060" }
              ],
              "dcterms:spatial": [
                { "@id": "http://publications.europa.eu/resource/authority/continent/EUROPE" },
                { "@id": "http://publications.europa.eu/resource/authority/continent/OCEANIA" },
                { "@id": "http://publications.europa.eu/resource/authority/continent/AFRICA" },
                { "@id": "http://publications.europa.eu/resource/authority/continent/ASIA" },
                { "@id": "http://publications.europa.eu/resource/authority/continent/AMERICA" }
              ],
              "dcterms:language": {
                "@id": "http://publications.europa.eu/resource/authority/language/ENG"
              },
              "dcterms:accessRights": {
                "@id": "http://publications.europa.eu/resource/authority/access-right/PUBLIC"
              },
              "dcterms:rights": {
                "@id": "https://creativecommons.org/licenses/by-sa/4.0/"
              },
              "dcterms:issued": {
                "@value": "2026-01-30",
                "@type": "xsd:date"
              },
              "dcterms:modified": {
                "@value": "$TODAY",
                "@type": "xsd:date"
              },
              "dcterms:temporal": {
                "@type": "dcterms:PeriodOfTime",
                "dcat:startDate": {
                  "@value": "1882-01-01",
                  "@type": "xsd:date"
                },
                "dcat:endDate": {
                  "@value": "$TODAY",
                  "@type": "xsd:date"
                }
              },
              "dcterms:publisher": {
                "@type": "foaf:Organization",
                "foaf:name": "European Viral Outbreak Response Alliance (EVORA)"
              },
              
              "dcat:contactPoint": {
                "@type": "vcard:Kind",
                "vcard:fn": "EVORA FAIR dataset Helpdesk",
                "vcard:hasEmail": {
                  "@id": "mailto:data-europa-helpdesk@evora-project.eu"
                },
                "vcard:hasURL": {
                  "@id": "https://evora-project.eu"
                }
              },
              "dcterms:license": {
                "@id": "http://creativecommons.org/licenses/by-sa/4.0/"
              },
              "dcat:landingPage": {
                "@id": "https://portal.evora-project.eu"
              },
              "dcat:distribution": {
                "@id": "$EU_DOWNLOAD_URL"
              }
            },
            {
              "@id": "$EU_DOWNLOAD_URL",
              "@type": "dcat:Distribution",
              "dcterms:identifier": "evora-portal-dataset-distribution",
              "dcterms:title": "EVORA Portal full JSON-LD export",
              "dcterms:issued": {
                "@value": "2026-01-30",
                "@type": "xsd:date"
              },
              "dcat:byteSize": {
                "@value": $SIZE,
                "@type": "http://www.w3.org/2001/XMLSchema#decimal"
              },
              "dcterms:modified": {
                "@value": "$TODAY",
                "@type": "xsd:date"
              },
              "dcterms:license": {
                "@id": "http://creativecommons.org/licenses/by-sa/4.0/"
              },
              "dcterms:rights": {
                "@id": "https://creativecommons.org/licenses/by-sa/4.0/"
              },
              "dcterms:accessRights": {
                "@id": "http://publications.europa.eu/resource/authority/access-right/PUBLIC"
              },
              "dcat:downloadURL": {
                "@id": "$EU_DOWNLOAD_URL"
              },
              "dcat:accessURL": {
                "@id": "https://portal.evora-project.eu"
              },
              "dcat:mediaType": {
                "@id": "https://www.iana.org/assignments/media-types/application/ld+json"
              },
              "dcterms:format": {
                "@id": "http://publications.europa.eu/resource/authority/file-type/JSON_LD"
              },
              "dcat:accessService": {
                "@id": "https://portal-api.evora-europe.eu/service"
              }
            },
            {
              "@id": "https://portal-api.evora-europe.eu/service",
              "@type": "dcat:DataService",
              "dcterms:identifier": "evora-portal-dataset-api",
              "dcterms:title": "EVORA Portal API",
              "dcterms:description": "REST API providing programmatic access to EVORA catalogue entities including viral materials, products and services.",
              "dcat:endpointURL": {
                "@id": "https://portal-api.evora-europe.eu"
              },
              "dcat:endpointDescription": {
                "@id": "https://portal-api.evora-europe.eu/docs"
              },
              "dcterms:license": {
                "@id": "http://creativecommons.org/licenses/by-sa/4.0/"
              },
              "dcat:servesDataset": {
                "@id": "https://portal.evora-project.eu/dataset/evora-portal"
              },
              "dcterms:accessRights": {
                "@id": "https://publications.europa.eu/resource/authority/access-right/PUBLIC"
              }
            }
          ]
          }
          EOF

      # The store has migrated; hub-repo still uses its service-account login.
      - name: Get EU catalogue repository JWT
        env:
          EU_ID: ${{ secrets.EU_ID }}
          EU_TOKEN: ${{ secrets.EU_TOKEN }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n --arg id "$EU_ID" --arg secret "$EU_TOKEN" \
            '{client_id: $id, client_secret: $secret}')
          # Keep credential-bearing responses out of logs, including on failure.
          RESP=$(curl --silent --show-error --fail \
            --connect-timeout 30 --max-time 120 \
            --request POST "https://data.europa.eu/auth/middleware/login/service" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD")
          TOKEN=$(echo "$RESP" | jq -er '.access_token | select(type == "string" and length > 0)')
          echo "::add-mask::$TOKEN"
          echo "EU_REPO_BEARER=$TOKEN" >> "$GITHUB_ENV"

      - name: Publish dataset to EU catalogue hub-repo
        env:
          # Preserve the catalogue identifier used by the original workflow.
          CATALOG: ${{ secrets.EU_ID }}
        run: |
          set -e
          DATASET_ID="evora-portal-dataset"
      
          echo "Publishing wrapper dataset to hub-repo..."
      
          curl --silent --show-error --fail-with-body --location \
               --write-out '\nHub-repo HTTP status: %{http_code}\n' \
               --retry "${{ inputs.metadata_only && '0' || '6' }}" \
               --retry-delay 300 \
               --retry-all-errors \
               --max-time 300 \
               --request PUT \
            "https://data.europa.eu/api/hub/repo/catalogues/$CATALOG/datasets/origin?originalId=$DATASET_ID" \
            --header "Content-Type: application/ld+json" \
            --header "Authorization: Bearer $EU_REPO_BEARER" \
            --data-binary @eu_dataset_wrapper.jsonld

